[project]
name = "pii-autoresearch"
version = "0.1.0"
description = "Autonomous research for improving PII extraction quality and cost"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "langchain-text-splitters>=1.0.0",
    "openai>=2.0.0",
    "pydantic>=2.0.0",
    "rapidfuzz>=3.14.0",
    "tiktoken>=0.7.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
pii-compare = "src.evaluation.compare_cli:entrypoint"
pii-eval = "src.evaluation.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[dependency-groups]
dev = [
    "black>=25.0.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: uses the OpenAI API and incurs cost",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
