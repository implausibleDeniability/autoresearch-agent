<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="trajectory-title trajectory-desc">
  <title id="trajectory-title">Autoresearch trajectory</title>
  <desc id="trajectory-desc">Dev dataset trajectory across 25 experiments, from 75.0% to 93.0%. Retained improvements are evenly spaced chronologically. Experiment 5, Fail closed on completion-length exhaustion, +10.4 percentage points. Catch length-limit failures and return an empty extraction instead of accepting partial output. Experiment 7, Repair unpaired surname fields, +1.7 percentage points. Move unpaired middle-name values into the surname field and remove duplicate middle/last values. Experiment 8, Repair compound surname fields, +1.1 percentage points. Join non-suffix middle-name parts with the last name to preserve compound surnames. Experiment 15, Recover explicit header identities, +0.5 percentage points. Parse CN and display-email headers, then merge matching people by surname plus name or email. Experiment 20, Recover cited surnames, +0.6 percentage points. Extract unique surnames from “et al.” citations when they are not already present. Experiment 23, Recover explicit prose identities, +0.6 percentage points. Recover names from bylines, attributions, signatures, and titled salutations without duplicates. Experiment 24, Recover signature street lines, +0.6 percentage points. Find street lines beneath McKinsey signatures and attach them to the nearest named person.</desc>
  <rect width="1500" height="900" fill="#0B0F19" />
  <text x="60" y="58" fill="#EDF3FF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="34" font-weight="650">Autoresearch trajectory</text>
  <text x="60" y="94" fill="#AAB6CC" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16" font-weight="400">Dev dataset · 25 experiments</text>
  <text x="1440" y="55" fill="#EDF3FF" font-family="IBM Plex Mono, Consolas, monospace" font-size="28" font-weight="650" text-anchor="end">75.0%  →  93.0%</text>
  <text x="1440" y="86" fill="#5AA7FF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="400" text-anchor="end">+17.9 pp on Dev dataset</text>
  <line x1="60" y1="142" x2="92" y2="142" stroke="#5AA7FF" stroke-width="3" />
  <text x="103" y="147" fill="#AAB6CC" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="400">Dev dataset</text>
  <line x1="88" y1="790.00" x2="950" y2="790.00" stroke="#273149" stroke-width="1" />
