  <line x1="88" y1="634.50" x2="950" y2="634.50" stroke="#273149" stroke-width="1" />
  <text x="74" y="639.4999999999999" fill="#AAB6CC" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" font-weight="400" text-anchor="end">80.0%</text>
  <line x1="88" y1="479.00" x2="950" y2="479.00" stroke="#273149" stroke-width="1" />
  <text x="74" y="484.00000000000006" fill="#AAB6CC" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" font-weight="400" text-anchor="end">85.0%</text>
  <line x1="88" y1="323.50" x2="950" y2="323.50" stroke="#273149" stroke-width="1" />
  <text x="74" y="328.49999999999994" fill="#AAB6CC" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" font-weight="400" text-anchor="end">90.0%</text>
  <line x1="88" y1="168.00" x2="950" y2="168.00" stroke="#273149" stroke-width="1" />
  <text x="74" y="173.0000000000001" fill="#AAB6CC" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" font-weight="400" text-anchor="end">95.0%</text>
  <text x="24" y="479.0" fill="#AAB6CC" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="middle" transform="rotate(-90 24 479.0)">F-score (β² = 5)</text>
  <path d="M 88.00 788.58 H 141.88 V 464.68 H 195.75 V 450.04 H 249.62 V 396.85 H 303.50 V 363.00 H 357.38 V 357.03 H 411.25 V 345.90 H 465.12 V 338.84 H 519.00 V 323.08 H 572.88 V 317.51 H 626.75 V 308.89 H 680.62 V 308.05 H 734.50 V 300.96 H 788.38 V 282.09 H 842.25 V 267.54 H 896.12 V 248.74 H 950.00 V 230.42" fill="none" stroke="#5AA7FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-series="all-retained-improvements" />
