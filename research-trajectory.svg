<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="trajectory-title trajectory-desc">
  <title id="trajectory-title">PII extraction research trajectory</title>
  <desc id="trajectory-desc">Dev dataset trajectory across 20 experiments, from 69.9% to 85.0%. Accepted improvements: experiment 3, bounded fallback for output-capped correspondence, +15.0 pp, finding: Representative score improved substantially with all documents complete.</desc>
