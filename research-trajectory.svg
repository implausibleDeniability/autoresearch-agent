    <tspan x="1070" dy="15">extraction instead of accepting partial output</tspan>
  </text>
  <line x1="1015" y1="233" x2="1450" y2="233" stroke="#1A2234" stroke-width="1" />
  <text x="1015" y="271" fill="#5AA7FF" font-family="IBM Plex Mono, Consolas, monospace" font-size="26" font-weight="650">02</text>
  <text x="1070" y="261" fill="#AAB6CC" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="600">EXP 07  ·  +1.7 pp</text>
  <text x="1070" y="284" fill="#EDF3FF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="17" font-weight="650">
