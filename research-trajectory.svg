  </g>
  <text x="1015" y="119" fill="#AAB6CC" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="650" letter-spacing="1.8">TOP 7 HYPOTHESES WORKED</text>
  <text x="1015" y="163" fill="#5AA7FF" font-family="IBM Plex Mono, Consolas, monospace" font-size="26" font-weight="650">01</text>
  <text x="1070" y="153" fill="#AAB6CC" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="600">EXP 05  ·  +10.4 pp</text>
